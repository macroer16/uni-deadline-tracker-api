# Runs the API with a real PostgreSQL database: docker compose up --build
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: deadlines
      POSTGRES_PASSWORD: local-only-password
      POSTGRES_DB: deadlines
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deadlines"]
      interval: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://deadlines:local-only-password@db:5432/deadlines
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me-in-prod}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
