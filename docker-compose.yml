# Runs the web app, API and PostgreSQL together: docker compose up --build
# Then open http://localhost:8080
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: deadlines
      POSTGRES_PASSWORD: local-only-password
      POSTGRES_DB: deadlines
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deadlines"]
      interval: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      UVICORN_ROOT_PATH: /api
      DATABASE_URL: postgresql+psycopg://deadlines:local-only-password@db:5432/deadlines
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me-in-prod}
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
